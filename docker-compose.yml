# Deployment shape per AeroNex_Architecture.md's Deployment section.
#
# `api` runs the stdlib http.server backend (Backend/app/api/server.py).
# It talks to SQLite by default, or to a real Postgres/Supabase instance
# when DATABASE_URL is set (see Backend/app/db.py's Postgres path) - set
# DATABASE_URL in Backend/.env (see Backend/.env.example) to point `api`
# at Supabase instead of the bundled `postgres` service below. The local
# `postgres` service here is a convenience for self-hosting without
# Supabase; either way the schema (Backend/app/db.py's SCHEMA) is a
# straight port, not a redesign.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aeronex
      POSTGRES_USER: aeronex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aeronex"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./Backend
    environment:
      # Unset (default) -> SQLite at Backend/data/aeronex_spike.db. Set this
      # to a Supabase/Postgres connection string to go real-time/hosted -
      # see Backend/.env.example and app/db.py's Postgres path.
      DATABASE_URL: ${DATABASE_URL:-}
    ports:
      - "8000:8000"
    volumes:
      - api_data:/app/data
    command: ["python", "run_api.py", "8000"]

  web:
    build:
      context: ./Frontend
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8000
      # Only needed for the realtime chart/card updates (Supabase Realtime
      # postgres_changes) - the REST API above works fine without these.
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    ports:
      - "3000:3000"
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - web
      - api

volumes:
  postgres_data:
  api_data:
  caddy_data:
